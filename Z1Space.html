function renderImpressions(){document.title='Z1Space · 创建分身';app.innerHTML=header(1)+'<main class="onboard-container"><div class="onboard-title"><div><span class="eyebrow">STEP 02 / YOUR AGENT</span><h1>你好，小林。这是我眼中的你。</h1><p>从你的知乎表达中，形成三段印象。你可以自由修改，让分身更像自己。</p></div><span class="pill">'+icon('check')+' 示例资料已连接</span></div><div class="onboard-grid"><aside class="identity-card">'+ownAvatar('big')+'<div><h3>小林</h3><p>@ lin_thinks · 知乎示例账号</p></div><div class="divider"></div><div class="source-line"><span>公开回答</span><b>18 篇</b></div><div class="source-line"><span>公开文章</span><b>6 篇</b></div><div class="source-line"><span>关注话题</span><b>12 个</b></div><div class="divider"></div><p class="demo-label">以下是演示资料生成的印象，不代表真实账号画像。保存后会展示在你的个人主页。</p></aside><div>'+impressionFields(state.impressions)+'<div class="form-actions">'+button('back-auth','上一步','button ghost')+'<div>'+button('save-impressions','保存修改','button secondary')+button('continue-impressions','保存并继续 '+icon('arrow'))+'</div></div></div></div></main>';bindImpressionCounters()}
function bindImpressionCounters(){document.querySelectorAll('[data-impression]').forEach(t=>t.addEventListener('input',()=>t.closest('.impression-card').querySelector('[data-counter]').textContent=t.value.length+'/420'))}
function readImpressions(root=document){const inputs=[...root.querySelectorAll('[data-impression]')],values=inputs.map(t=>t.value.trim());const bad=values.findIndex(v=>v.length<8);if(bad!==-1){toast('请为每段印象保留至少 8 个字，让分身更了解你。');inputs[bad].focus();return null}return values}
function skillCard(s){const installed=state.skills.some(x=>x.id===s.id);return '<article class="skill-card '+(installed?'installed':'')+'"><div class="skill-top">'+skillIcon(s)+(installed?'<span class="pill">已添加</span>':'<span class="demo-label">'+(s.kind==='people'?'发现人':'发现内容')+'</span>')+'</div><h3>'+esc(s.name)+'</h3><p>'+esc(s.desc)+'</p><div class="skill-bottom"><small>'+esc(s.frequency)+'</small>'+button('add-skill',installed?icon('check')+' 已添加':icon('plus')+' 添加 Skill',installed?'button quiet small':'button secondary small','data-id="'+s.id+'" '+(installed?'disabled':''))+'</div></article>'}
function customCard(){return '<article class="skill-card skill-custom"><span class="skill-icon">'+icon('plus')+'</span><h3>创建你的 Skill</h3><p>把你想完成的事，<br>变成 Agent 的一项能力。</p>'+button('new-skill','自定义 Skill','button secondary small')+'</article>'}
function renderOnboardSkills(){document.title='Z1Space · 为分身添加 Skill';app.innerHTML=header(2)+'<main class="onboard-container"><div class="onboard-title"><div><span class="eyebrow">STEP 03 / GIVE IT SKILLS</span><h1>让你的分身，开始行动。</h1><p>添加现成的 Skill，或创建一个自己的任务。添加后会同步展示在个人主页。</p></div><span class="pill">'+state.skills.length+' 项能力已添加</span></div><div class="skill-grid">'+templates.map(skillCard).join('')+customCard()+'</div><div class="onboard-skill-summary"><span>'+icon('spark')+' 已添加 '+state.skills.length+' 个 Skill'+(state.skills.length?' · '+state.skills.map(s=>esc(s.name)).join('、'):' · 可以先添加“寻找同路人”')+'</span><span class="small-text">之后可随时调整</span></div><div class="form-actions">'+button('back-impressions','上一步','button ghost')+'<div>'+button('skip-skills','稍后添加','button ghost')+button('finish-onboarding','进入我的 Space '+icon('arrow'))+'</div></div><p class="demo-label" style="margin-top:16px">Skill 在本原型中使用预设示例资料运行；每日频率为配置展示，不会在浏览器关闭后自动执行。</p></main>'}
const navs=[['discover','compass','发现同路人'],['feed','feed','关注动态'],['skills','layers','我的 Skills'],['messages','message','真人消息'],['profile','user','个人主页']];
function renderWorkspace(){document.title='Z1Space · '+navs.find(x=>x[0]===currentView)[2];const nav=navs.map(([id,ic,label])=>'<button class="nav-button '+(currentView===id?'active':'')+'" data-action="nav" data-view="'+id+'" '+(currentView===id?'aria-current="page"':'')+'>'+icon(ic)+'<span>'+label+'</span>'+(id==='messages'&&Object.keys(state.chats).length?'<span class="nav-count">'+Object.keys(state.chats).length+'</span>':'')+'</button>').join('');app.innerHTML='<div class="app-layout"><aside class="sidebar">'+logo()+'<nav class="side-nav" aria-label="主导航">'+nav+'</nav><div class="sidebar-note"><strong>让分身去发现，让真人相遇。</strong><p>你的表达是起点。<br>好的连接，始于一次有话可聊。</p></div><button class="side-account" style="background:none;text-align:left" data-action="nav" data-view="profile">'+ownAvatar('small')+'<div><strong>小林</strong><small>我的 Space</small></div><span class="account-more">···</span></button></aside><div class="main-area"><header class="workspace-header"><div class="breadcrumb">我的 Space <span>/</span><b>'+navs.find(x=>x[0]===currentView)[2]+'</b></div><div class="mobile-brand">'+logo()+'</div><div class="top-status"><span class="demo-tag">原型 · 示例数据</span>'+ownAvatar('small')+'</div></header><main class="workspace-main">'+({discover:discoverView,feed:feedView,skills:skillsView,messages:messagesView,profile:profileView}[currentView])()+'</main></div></div>';if(currentView==='messages'){const list=document.getElementById('chat-messages');if(list)list.scrollTop=list.scrollHeight}}

function rail(){return '<aside class="rail"><section class="rail-card"><h3>你的 Agent 分身</h3><div class="mini-agent"><span class="avatar">Z¹</span><div><b>小林的 Agent</b><small>基于你的知乎表达</small></div></div><p>'+esc(state.impressions[0].slice(0,69))+'…</p>'+button('nav','查看我的分身 '+icon('arrow'),'text-button','data-view="profile"')+'<div class="divider"></div><h3>已装备的 Skills</h3>'+(state.skills.length?state.skills.slice(0,3).map(s=>'<div class="rail-skill">'+skillIcon(s)+'<span>'+esc(s.name)+'</span><span>'+(s.enabled?'已启用':'已暂停')+'</span></div>').join(''):'<p>给分身添加第一个 Skill，开始探索。</p>')+'</section><section class="rail-card"><h3>最近的探索</h3>'+(state.runs.length?state.runs.slice(-3).reverse().map(r=>'<div class="activity-line">'+icon('spark')+'<div><b>'+esc(r.name)+' · '+r.count+' 个结果</b><small>'+esc(r.time)+' · 演示运行</small></div></div>').join(''):'<div class="activity-line">'+icon('check')+'<div><b>分身印象已保存</b><small>你可以随时修改</small></div></div><div class="activity-line">'+icon('compass')+'<div><b>发现了 3 位同路人</b><small>初始兴趣推荐 · 示例</small></div></div>')+'</section><div class="rail-footer">Z1Space · 知乎黑客松<br>人物与动态均为示例资料<br>演示进度保存在当前浏览器</div></aside>'}
function emptyState(ic,title,text,action){return '<div class="empty-state"><div class="skill-icon">'+icon(ic)+'</div><h3>'+title+'</h3><p>'+text+'</p>'+action+'</div>'}
function personCard(p){const followed=state.following.includes(p.id);return '<article class="person-card"><div class="person-top">'+avatar(p)+'<div class="person-info"><button class="person-name" data-action="person" data-id="'+p.id+'">'+p.name+'</button><div class="person-subtitle">'+p.role+'</div></div>'+button('follow',followed?icon('check')+' 已关注':icon('plus')+' 关注',followed?'button quiet small':'button secondary small','data-id="'+p.id+'"')+'</div><p class="person-bio">'+p.bio+'</p><div class="person-tags">'+p.tags.map(t=>'<span class="tag">'+t+'</span>').join('')+'</div><div class="match-reason">'+icon('spark')+'<p><b>Agent 为什么推荐</b><br>'+p.reason+'</p></div><div class="card-foot"><small>知乎表达 · '+p.contentCount+' 篇示例内容</small>'+button('invite','找个话题聊聊 '+icon('arrow'),'text-button','data-id="'+p.id+'"')+'</div></article>'}
function discoverView(){const ids=state.discoverIds;const result=discoverTab==='people'?(ids.length?ids.map(lookup).filter(Boolean).map(personCard).join(''):emptyState('compass','还没有匹配的同路人','调整 Skill 关键词，试试其他探索方向。',button('nav','调整我的 Skills','button secondary','data-view="skills"'))):(state.contentIds.length?posts.filter(p=>state.contentIds.includes(p.id)).map(postCard).join(''):emptyState('book','还没有匹配的内容','换一组关键词，让 Agent 继续寻找。',button('nav','调整我的 Skills','button secondary','data-view="skills"')));return heading('遇见，值得聊的人。','从你关心的问题出发，让 Agent 帮你找到同路人。')+'<div class="workspace-columns"><div class="workspace-content"><div class="agent-banner"><div class="agent-symbol">Z¹</div><div class="banner-copy"><h2>你的好奇心，正在找到回应。</h2><p>'+ids.length+' 位与你有共同话题的人，等你认识。</p></div>'+button('explore','让 Agent 再找找 '+icon('arrow'),'button small')+'</div><div class="switch-tabs" role="tablist" aria-label="发现类型">'+[['people','为你发现的人'],['content','值得看的内容']].map(([key,label])=>'<button class="switch-tab '+(discoverTab===key?'active':'')+'" role="tab" aria-selected="'+(discoverTab===key)+'" data-action="discover-tab" data-tab="'+key+'">'+label+'</button>').join('')+'</div>'+result+'</div>'+rail()+'</div>'}
function postCard(p){const owner=lookup(p.person),liked=state.liked.includes(p.id),saved=state.saved.includes(p.id);return '<article class="post-card"><div class="post-kind">'+icon(p.kind==='赞同'?'heart':p.kind==='分享'?'send':'edit')+'<span>'+owner.name+' '+(p.kind==='赞同'?'赞同了这篇内容':p.kind==='分享'?'分享了一个想法':'发布了一篇内容')+'</span><span style="margin-left:auto">'+p.time+'</span></div><div class="post-head">'+avatar(owner,'small')+'<div><b>'+(p.author||owner.name)+'</b><small>知乎内容示例 · '+owner.tags.slice(0,2).join(' / ')+'</small></div></div><h3>'+p.title+'</h3><p>'+p.text+'</p>'+(p.quote?'<div class="post-quote">'+p.quote+'</div>':'')+button('read-post','继续阅读 '+icon('arrow'),'text-button','data-id="'+p.id+'"')+'<div class="post-actions"><button class="post-action '+(liked?'on':'')+'" data-action="like-post" data-id="'+p.id+'" aria-pressed="'+liked+'">'+icon('heart')+' '+(p.likes+(liked?1:0))+'</button><button class="post-action '+(saved?'on':'')+'" data-action="save-post" data-id="'+p.id+'" aria-pressed="'+saved+'">'+icon('bookmark')+' '+(saved?'已收藏':'收藏')+'</button>'+button('invite','和 '+owner.name+' 聊聊','text-button','data-id="'+owner.id+'" data-post="'+p.id+'"')+'</div></article>'}
function feedView(){const follows=state.following.map(lookup).filter(Boolean);let list=posts.filter(p=>state.following.includes(p.person));if(feedPerson!=='all')list=list.filter(p=>p.person===feedPerson);if(feedKind!=='all')list=list.filter(p=>p.kind===feedKind);return heading('关注的人，正在分享。','从他们最近的内容和互动，找到下一次交流的起点。',button('nav','发现更多人','button secondary','data-view="discover"'))+'<div class="workspace-columns"><div class="workspace-content">'+(follows.length?'<div class="following-strip"><button class="follow-person '+(feedPerson==='all'?'active':'')+'" data-action="feed-person" data-id="all"><span class="avatar">'+icon('people')+'</span>全部关注</button>'+follows.map(p=>'<button class="follow-person '+(feedPerson===p.id?'active':'')+'" data-action="feed-person" data-id="'+p.id+'">'+avatar(p)+p.name+'</button>').join('')+'</div><div class="switch-tabs">'+[['all','全部动态'],['发布','发布'],['分享','分享'],['赞同','赞同']].map(([key,label])=>'<button class="switch-tab '+(feedKind===key?'active':'')+'" data-action="feed-kind" data-kind="'+key+'">'+label+'</button>').join('')+'</div><p class="feed-caption">已关注 '+follows.length+' 人 · 以下为知乎动态演示数据</p>'+(list.length?list.map(postCard).join(''):emptyState('feed','这里暂时没有这类动态。','换一个分类，或看看全部关注的内容。',button('reset-feed','查看全部动态','button secondary'))):emptyState('people','先关注一个值得聊的人。','关注后，你会在这里看到他最近发布、分享和赞同的内容。',button('nav','去发现同路人 '+icon('arrow'),'button','data-view="discover"')))+'</div>'+rail()+'</div>'}
function skillsView(){return heading('让你的 Agent，多一点本领。','每个 Skill 都是一项具体委托，也会展示在你的个人主页。',button('new-skill',icon('plus')+' 创建 Skill'))+(state.skills.length?state.skills.map(s=>'<article class="installed-skill">'+skillIcon(s)+'<div class="skill-details"><h3>'+esc(s.name)+'</h3><p>'+esc(s.goal)+'</p><div class="person-tags"><span class="tag">'+(s.kind==='people'?'寻找人':'整理内容')+'</span><span class="tag">'+esc(s.frequency)+'</span><span class="tag">个人主页可见</span></div></div><div class="installed-actions"><button class="toggle '+(s.enabled?'on':'')+'" role="switch" aria-checked="'+s.enabled+'" aria-label="'+esc(s.name)+(s.enabled?'：暂停':'：启用')+'" data-action="toggle-skill" data-id="'+s.id+'"></button>'+button('run-skill',icon('play')+' 运行','button quiet small','data-id="'+s.id+'" '+(!s.enabled?'disabled':''))+'<button class="icon-button" aria-label="编辑 '+esc(s.name)+'" data-action="edit-skill" data-id="'+s.id+'">'+icon('edit')+'</button><button class="icon-button" aria-label="删除 '+esc(s.name)+'" data-action="remove-skill" data-id="'+s.id+'">'+icon('trash')+'</button></div></article>').join(''):emptyState('layers','给分身添加第一项能力。','可以从下方模板开始，也可以创建自己的 Skill。',button('new-skill','创建 Skill','button secondary')))+'<div class="library-heading"><h2>从这些 Skills 开始</h2><span class="demo-label">按需添加，随时修改</span></div><div class="skill-grid">'+templates.map(skillCard).join('')+customCard()+'</div><div class="demo-note">演示 Skill 在当前页面中运行，结果来自示例资料库。“每日一次”只保存频率偏好，本原型不执行后台定时任务。</div>'}
function profileView(){return heading('我的 Space','你如何思考，你能做什么，都从这里被看见。')+'<div class="workspace-columns"><div><section class="profile-panel"><div class="profile-cover"><span class="profile-word">Z1Space</span></div><div class="profile-main"><div class="profile-identity">'+ownAvatar('big')+button('edit-profile',icon('edit')+' 编辑分身印象','button secondary small')+'</div><div class="profile-name"><h1>小林</h1><span class="pill">知乎示例账号已连接</span></div><p class="profile-bio">@ lin_thinks · 让好奇心多走一步。</p><div class="person-tags"><span class="tag">AI 产品</span><span class="tag">交互设计</span><span class="tag">知识管理</span></div><div class="profile-stats"><div><b>'+state.skills.length+'</b> Skills</div><div><b>'+state.following.length+'</b> 关注</div><div><b>'+Object.values(state.chats).filter(c=>c.status==='connected').length+'</b> 连接</div></div></div><div class="profile-section"><h2>'+icon('spark')+' Agent 眼中的我</h2>'+state.impressions.map((v,i)=>'<div class="profile-impression"><span>0'+(i+1)+'</span><div><h3>'+impressionTitles[i]+'</h3><p>'+esc(v)+'</p></div></div>').join('')+'</div><div class="profile-section"><h2>我的 Skills '+button('nav','管理 Skills '+icon('arrow'),'text-button','data-view="skills"')+'</h2>'+(state.skills.length?'<div class="profile-skills">'+state.skills.map(s=>'<div class="profile-skill">'+skillIcon(s)+'<div><b>'+esc(s.name)+'</b><small>'+(s.enabled?'已启用':'已暂停')+' · '+(s.kind==='people'?'发现人':'发现内容')+'</small></div></div>').join('')+'</div>':'<p class="small-text muted">还没有添加 Skill。给分身装备一项能力，让别人也看到你的兴趣。</p>')+'</div>'+(state.following.length?'<div class="profile-section"><h2>我关注的人</h2><div class="profile-skills">'+state.following.map(lookup).filter(Boolean).map(p=>'<button class="mini-person" data-action="person" data-id="'+p.id+'">'+avatar(p,'small')+'<div><strong>'+p.name+'</strong><small>'+p.role+'</small></div></button>').join('')+'</div></div>':'')+'</section><div class="demo-settings"><div><b>演示进度已保存在本机</b><p>重新体验会清空当前浏览器里的分身、Skills、关注和聊天。</p></div>'+button('reset','重新体验','button secondary small')+'</div></div>'+rail()+'</div>'}
function messagesView(){const ids=Object.keys(state.chats);if(!chatId||!state.chats[chatId])chatId=ids[0]||null;const c=chatId?state.chats[chatId]:null,p=c?lookup(chatId):null;return heading('让对话，回到你们。','Agent 帮你找到开场，接下来由真人交流。')+'<div class="chat-layout"><aside class="conversation-list"><h3>我的连接</h3>'+(ids.length?ids.map(id=>{const x=lookup(id),t=state.chats[id],last=t.messages[t.messages.length-1];return '<button class="conversation-item '+(id===chatId?'active':'')+'" data-action="open-chat" data-id="'+id+'">'+avatar(x,'small')+'<div><b>'+x.name+'</b><small>'+(t.status==='pending'?'等待对方接受':esc(last?.text||'从共同话题开始'))+'</small></div></button>'}).join(''):'<p class="small-text muted" style="padding:8px">还没有会话</p>')+'</aside>'+(c?'<section class="chat-main"><header class="chat-heading"><div><b>'+p.name+'</b><small>'+p.role+'</small></div><span class="pill">'+(c.status==='pending'?'邀请待确认':'真人会话 · 演示')+'</span></header><div class="chat-context">'+icon('book')+'<div><small>你们的共同话题</small><b>'+esc(c.topic)+'</b></div></div><div class="chat-messages" id="chat-messages">'+(c.status==='pending'?'<div class="intro-panel"><h3>聊天邀请已创建</h3><p>“'+esc(c.invite)+'”</p><p class="small-text">演示中不会通知真实用户。模拟对方接受后，就能继续体验真人聊天。</p><div class="intro-options">'+button('accept-invite','模拟对方接受','button small','data-id="'+p.id+'"')+button('cancel-invite','撤回邀请','button secondary small','data-id="'+p.id+'"')+'</div></div>':'<div class="chat-date">你们已建立连接 · 演示会话</div>'+c.messages.map(m=>messageRow(m,p)).join(''))+'</div>'+(c.status==='connected'?'<div class="message-hint">本会话仅保存在你的浏览器中，消息不会发送给真实用户。</div><form class="chat-compose" id="message-form"><textarea id="message-input" aria-label="输入消息" placeholder="从这个共同话题开始，说说你的想法…" maxlength="1000"></textarea><div class="compose-footer">'+button('simulate-reply','模拟对方回复','text-button','data-id="'+p.id+'"')+'<button class="button small" type="submit">发送 '+icon('send')+'</button></div></form>':'')+'</section>':'<div class="chat-empty"><div class="skill-icon">'+icon('message')+'</div><h3>好的对话，从一个共同问题开始。</h3><p>发现一个想认识的人，向他发起聊天邀请。</p>'+button('nav','发现同路人','button','data-view="discover"')+'</div>')+'</div>'}
function messageRow(m,p){return '<div class="message-row '+(m.from==='me'?'self':'')+'">'+(m.from==='me'?ownAvatar('small'):avatar(p,'small'))+'<div class="message-body"><div class="message-bubble">'+esc(m.text)+'</div><small>'+(m.from==='me'?'你':p.name+' · 模拟回复')+' · '+esc(m.time)+'</small></div></div>'}
function showDialog(title,body,footer,wide=false){closeDialog();const d=document.createElement('dialog');d.className='dialog'+(wide?' wide-dialog':'');d.id='dialog';d.innerHTML='<div class="dialog-header"><h2>'+esc(title)+'</h2><button class="dialog-close" aria-label="关闭" data-action="close-dialog">×</button></div><div class="dialog-body">'+body+'</div>'+(footer?'<div class="dialog-footer">'+footer+'</div>':'');document.body.appendChild(d);d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog()}});d.addEventListener('cancel',()=>setTimeout(()=>d.remove(),0));d.showModal();return d}
function closeDialog(){const d=document.getElementById('dialog');if(d){d.close();d.remove()}}
function skillForm(id){const s=id?state.skills.find(x=>x.id===id):null;if(id&&!s)return;showDialog(s?'编辑 Skill':'创建一个自己的 Skill','<form id="skill-form" data-id="'+(s?.id||'')+'"><div class="field"><label for="skill-name">给 Skill 起个名字</label><input id="skill-name" maxlength="24" required placeholder="例如：寻找摄影同好" value="'+esc(s?.name||'')+'"></div><div class="field-row"><div class="field"><label for="skill-kind">它主要帮你做什么？</label><select id="skill-kind"><option value="people" '+(s?.kind==='people'?'selected':'')+'>寻找值得聊的人</option><option value="content" '+(s?.kind==='content'?'selected':'')+'>整理值得看的内容</option></select></div><div class="field"><label for="skill-frequency">运行频率</label><select id="skill-frequency"><option '+(s?.frequency==='手动运行'?'selected':'')+'>手动运行</option><option '+(s?.frequency==='每日一次'?'selected':'')+'>每日一次</option></select></div></div><div class="field"><label for="skill-goal">告诉 Agent 你的具体需求</label><textarea id="skill-goal" required maxlength="500" placeholder="我想认识喜欢城市摄影、愿意分享观察方法的人。">'+esc(s?.goal||'')+'</textarea></div><div class="field"><label for="skill-keywords">关注关键词</label><input id="skill-keywords" maxlength="100" required placeholder="例如：摄影 城市 观察" value="'+esc(s?.keywords||'')+'"><small>用空格或逗号分隔，原型会在示例资料库中匹配。</small></div><div class="demo-note">创建后会显示在你的个人主页。演示支持找人与找内容；频率配置不会启动后台任务。</div></form>',button('close-dialog','取消','button secondary')+'<button class="button" type="submit" form="skill-form">'+(s?'保存修改':'创建并添加')+'</button>')}
function saveSkill(form){const name=form.querySelector('#skill-name').value.trim(),goal=form.querySelector('#skill-goal').value.trim(),keywords=form.querySelector('#skill-keywords').value.trim();if(!name||!goal||!keywords){toast('请补全 Skill 名称、需求和关键词。');return}const id=form.dataset.id||'custom-'+Date.now().toString(36);if(state.skills.some(x=>x.id!==id&&x.name===name)){toast('已经有同名 Skill，请换一个名字。');return}const old=state.skills.find(x=>x.id===id),s={id,name,goal,keywords,kind:form.querySelector('#skill-kind').value,frequency:form.querySelector('#skill-frequency').value,desc:goal,icon:old?.icon||'spark',color:old?.color||'purple',enabled:old?.enabled??true};state.skills=old?state.skills.map(x=>x.id===id?s:x):[...state.skills,s];persist();closeDialog();render();toast(old?'Skill 已更新。':'Skill 已添加，并展示在你的个人主页。')}
function addSkill(id){const t=templates.find(x=>x.id===id);if(!t||state.skills.some(x=>x.id===id))return;state.skills.push({...t,enabled:true});persist();render();toast(t.name+' 已添加到个人主页。')}
function runSkill(id){const s=state.skills.find(x=>x.id===id);if(!s||!s.enabled){toast('请先启用这个 Skill。');return}const terms=s.keywords.toLowerCase().split(/[\s,，、]+/).filter(Boolean),matches=s.kind==='people'?people.filter(p=>terms.some(t=>(p.tags.join(' ')+p.role+p.bio).toLowerCase().includes(t))):posts.filter(p=>terms.some(t=>(p.title+p.text+lookup(p.person).tags.join(' ')).toLowerCase().includes(t)));const d=showDialog('让「'+s.name+'」去探索','<p class="small-text">'+esc(s.goal)+'</p><div class="demo-note">演示运行 · 从预设示例资料中查找，不会访问真实知乎。</div><div id="run-stages">'+['理解你的兴趣与任务','匹配示例内容与人物','整理推荐理由与交流线索'].map((t,i)=>'<div class="run-stage" id="run-stage-'+i+'">'+(i===0?'<span class="loading"></span>':icon('clock'))+'<span>'+t+'</span></div>').join('')+'</div><div id="run-output"></div>',button('close-dialog','关闭','button secondary'));
 let index=0;const timer=setInterval(()=>{if(state.step!=='done'){clearInterval(timer);return}const row=d.querySelector('#run-stage-'+index);if(row){row.classList.add('done');row.innerHTML=icon('check')+'<span>'+['已读取你的任务配置','已检查示例资料中的相关性','已整理可查看的结果'][index]+'</span>'}index++;const next=d.querySelector('#run-stage-'+index);if(next)next.innerHTML='<span class="loading"></span><span>'+['','正在匹配示例内容与人物','正在整理推荐理由'][index]+'</span>';if(index===3){clearInterval(timer);state.runs.push({skillId:s.id,name:s.name,count:matches.length,kind:s.kind,time:time()});if(s.kind==='people')state.discoverIds=matches.map(p=>p.id);else state.contentIds=matches.map(p=>p.id);persist();if(document.body.contains(d)){d.querySelector('#run-output').innerHTML='<div class="run-result"><h3>'+(matches.length?'找到 '+matches.length+' 个'+(s.kind==='people'?'交流线索':'内容结果'):'暂时没有匹配结果')+'</h3><p>'+(matches.length?matches.slice(0,3).map(x=>esc(x.name||x.title)).join(' · '):'示例资料库暂未覆盖这些关键词，可以尝试“AI”“设计”“摄影”或“知识管理”。')+'</p></div>';d.querySelector('.dialog-footer').innerHTML=matches.length?button('view-run-results','查看探索结果 '+icon('arrow'),'button','data-kind="'+s.kind+'"'):button('close-dialog','完成','button secondary')}toast('「'+s.name+'」演示运行完成。')}},650)}
function personDialog(id){const p=lookup(id);if(!p)return;showDialog(p.name+'的 Space','<div class="person-top">'+avatar(p,'big')+'<div><h3 style="margin:0 0 5px">'+p.name+'</h3><p class="small-text" style="margin:0">'+p.role+'</p><span class="demo-label">示例人物 · 已开放连接</span></div></div><p style="margin-top:20px;font-size:14px">'+p.bio+'</p><div class="person-tags">'+p.tags.map(t=>'<span class="tag">'+t+'</span>').join('')+'</div><div class="match-reason">'+icon('spark')+'<p>'+p.reason+'</p></div><h3 style="font-size:15px;margin-top:23px">最近的表达</h3>'+posts.filter(x=>x.person===id).slice(0,2).map(x=>'<div class="summary-box">'+x.title+'<br>'+button('read-post','阅读内容','text-button','data-id="'+x.id+'"')+'</div>').join(''),button('follow',state.following.includes(id)?'已关注':'关注这个人','button secondary','data-id="'+id+'" data-modal="true"')+button('invite','发起真人聊天','button','data-id="'+id+'"'))}
function inviteDialog(id,postId){const p=lookup(id);if(!p)return;if(state.chats[id]){closeDialog();go('messages',id);return}const post=posts.find(x=>x.id===postId),topic=post?post.title:p.topic;showDialog('和 '+p.name+' 开始一段对话','<div class="person-top">'+avatar(p)+'<div><b>'+p.name+'</b><div class="person-subtitle">'+p.role+'</div></div></div><div class="summary-box"><span class="eyebrow">共同话题</span><br>'+esc(topic)+'</div><form id="invite-form" data-person="'+id+'" data-topic="'+esc(topic)+'"><div class="field"><label for="invite-text">Agent 帮你准备了一句开场白</label><textarea id="invite-text" maxlength="500" required>你好，看到你分享的内容，我也在关注「'+esc(topic)+'」。想听听你的实践经历，也很愿意交换我的想法。</textarea><small>你可以修改，再决定是否发出邀请。</small></div></form><div class="demo-note">此操作仅创建演示邀请，不会向知乎或真实用户发送消息。双方接受后再进入聊天。</div>',button('close-dialog','再想想','button secondary')+'<button type="submit" form="invite-form" class="button">发送邀请（演示）</button>')}
function readPost(id){const p=posts.find(x=>x.id===id);if(!p)return;const person=lookup(p.person);showDialog('知乎内容 · 示例','<div class="post-head">'+avatar(person,'small')+'<div><b>'+esc(p.author||person.name)+'</b><small>'+p.time+' · 演示文章</small></div></div><h2 style="font-size:24px;margin:20px 0">'+p.title+'</h2><div style="font-size:15px;line-height:2;color:#677b96;white-space:pre-wrap">'+p.text+'\n\n'+p.full+'</div><div class="demo-note">以上为原型编写的示例内容，不是真实知乎文章。</div>',button('close-dialog','关闭','button secondary')+button('invite','和 '+person.name+' 聊聊','button','data-id="'+person.id+'" data-post="'+id+'"'),true)}
function resetDialog(){showDialog('重新体验 Z1Space？','<p style="font-size:14px">这会清空当前浏览器中的分身印象、Skills、关注、收藏和演示聊天，返回知乎授权页。</p>',button('close-dialog','保留进度','button secondary')+button('confirm-reset','清空并重新开始'))}
function editProfile(){showDialog('编辑我的分身印象',impressionFields(state.impressions,true),button('close-dialog','取消','button secondary')+button('save-profile','保存修改'),true);bindImpressionCounters()}
function finishOnboard(){state.step='done';persist();currentView='discover';history.replaceState(null,'','#discover');renderWorkspace();window.scrollTo(0,0);toast('欢迎来到你的 Space。分身已经准备好了。')}
function followPerson(id){if(!lookup(id))return;const on=state.following.includes(id);state.following=on?state.following.filter(x=>x!==id):[...state.following,id];if(feedPerson===id&&on)feedPerson='all';persist();renderWorkspace();toast(on?'已取消关注。':'已关注 '+lookup(id).name+'，可在「关注动态」查看他的分享。')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const id=b.dataset.id,a=b.dataset.action;switch(a){
 case 'nav':go(b.dataset.view);break;
 case 'back-auth':state.step='auth';persist();render();break;
 case 'save-impressions':{const v=readImpressions(app);if(v){state.impressions=v;persist();toast('三段印象已保存。')}}break;
 case 'continue-impressions':{const v=readImpressions(app);if(v){state.impressions=v;state.step='skills';persist();render();window.scrollTo(0,0)}}break;
 case 'back-impressions':state.step='impressions';persist();render();break;
 case 'add-skill':addSkill(id);break;
 case 'new-skill':skillForm();break;
 case 'edit-skill':skillForm(id);break;
 case 'finish-onboarding':case 'skip-skills':finishOnboard();break;
 case 'close-dialog':closeDialog();break;
 case 'follow':followPerson(id);if(b.dataset.modal)personDialog(id);break;
 case 'person':personDialog(id);break;
 case 'invite':inviteDialog(id,b.dataset.post);break;
 case 'discover-tab':discoverTab=b.dataset.tab;renderWorkspace();break;
 case 'feed-person':feedPerson=id;renderWorkspace();break;
 case 'feed-kind':feedKind=b.dataset.kind;renderWorkspace();break;
 case 'reset-feed':feedPerson='all';feedKind='all';renderWorkspace();break;
 case 'like-post':state.liked=state.liked.includes(id)?state.liked.filter(x=>x!==id):[...state.liked,id];persist();renderWorkspace();break;
 case 'save-post':state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];persist();renderWorkspace();toast(state.saved.includes(id)?'已收藏，演示记录保存在本机。':'已取消收藏。');break;
 case 'read-post':readPost(id);break;
 case 'toggle-skill':state.skills=state.skills.map(s=>s.id===id?{...s,enabled:!s.enabled}:s);persist();renderWorkspace();break;
 case 'remove-skill':{const s=state.skills.find(s=>s.id===id);if(s)showDialog('移除「'+s.name+'」？','<p class="small-text">移除后不再展示在个人主页。你可以之后重新添加或创建。</p>',button('close-dialog','取消','button secondary')+button('confirm-remove-skill','移除 Skill','button','data-id="'+id+'"'));}break;
 case 'confirm-remove-skill':state.skills=state.skills.filter(s=>s.id!==id);persist();closeDialog();render();toast('Skill 已移除。');break;
 case 'run-skill':runSkill(id);break;
 case 'explore':{const enabled=state.skills.filter(s=>s.enabled);if(enabled.length===1)runSkill(enabled[0].id);else if(enabled.length>1)showDialog('让哪项 Skill 开始探索？',enabled.map(s=>'<div class="installed-skill" style="align-items:center">'+skillIcon(s)+'<div style="flex:1"><h3 style="margin:0;font-size:15px">'+esc(s.name)+'</h3><span class="demo-label">'+(s.kind==='people'?'寻找人':'整理内容')+'</span></div>'+button('run-skill','运行','button quiet small','data-id="'+s.id+'"')+'</div>').join(''),'');else showDialog('先给分身添加一项能力','<p class="small-text">添加「寻找同路人」，从你的兴趣出发寻找交流线索。</p>',button('close-dialog','稍后','button secondary')+button('quick-skill','添加并探索'));}break;
 case 'quick-skill':if(!state.skills.some(s=>s.id==='peers'))state.skills.push({...templates[0],enabled:true});else state.skills=state.skills.map(s=>s.id==='peers'?{...s,enabled:true}:s);persist();closeDialog();renderWorkspace();runSkill('peers');break;
 case 'view-run-results':discoverTab=b.dataset.kind==='people'?'people':'content';closeDialog();go('discover');break;
 case 'edit-profile':editProfile();break;
 case 'save-profile':{const v=readImpressions(document.getElementById('dialog'));if(v){state.impressions=v;persist();closeDialog();renderWorkspace();toast('个人主页上的三段印象已更新。')}}break;
 case 'open-chat':go('messages',id);break;
 case 'accept-invite':{const c=state.chats[id];if(c?.status==='pending'){c.status='connected';c.messages.push({from:'other',text:lookup(id).greeting,time:time()});persist();renderWorkspace();toast('已模拟对方接受，开始真人会话演示。')}}break;
 case 'cancel-invite':if(state.chats[id]?.status==='pending'){delete state.chats[id];persist();chatId=null;renderWorkspace();toast('演示邀请已撤回。')}break;
 case 'simulate-reply':{const c=state.chats[id];if(c?.status==='connected'){c.messages.push({from:'other',text:lookup(id).reply,time:time()});persist();renderWorkspace();toast('已插入一条示例回复。')}}break;
 case 'reset':resetDialog();break;
 case 'confirm-reset':state=fresh();persist();closeDialog();history.replaceState(null,'',location.pathname);chatId=null;feedPerson='all';feedKind='all';discoverTab='people';render();window.scrollTo(0,0);break;
 }});
document.addEventListener('submit',e=>{if(e.target.id==='skill-form'){e.preventDefault();saveSkill(e.target)}else if(e.target.id==='invite-form'){e.preventDefault();const f=e.target,id=f.dataset.person,text=f.querySelector('#invite-text').value.trim();if(!text){toast('写一句你想说的话，再发出邀请。');return}if(!state.chats[id])state.chats[id]={status:'pending',topic:f.dataset.topic,invite:text,messages:[]};persist();closeDialog();go('messages',id);toast('演示邀请已创建。')}else if(e.target.id==='message-form'){e.preventDefault();const input=document.getElementById('message-input'),text=input.value.trim();if(!text){toast('先写一句你想说的话。');return}if(!chatId||state.chats[chatId]?.status!=='connected')return;state.chats[chatId].messages.push({from:'me',text,time:time()});persist();renderWorkspace();document.getElementById('message-input')?.focus()}});
document.addEventListener('keydown',e=>{if(e.target.id==='message-input'&&e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();document.getElementById('message-form').requestSubmit()}});
window.addEventListener('hashchange',()=>{if(state.step==='done')render()});
function registerAgentTools(){const ctx=document.modelContext;if(!ctx?.registerTool)return;const lifecycle=new AbortController();window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});const defs=[{name:'read_z1space_state',title:'查看 Z1Space 演示状态',description:'读取当前浏览器的分身、Skill、关注与会话摘要，不改变状态。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute(input){if(!input||typeof input!=='object'||Object.keys(input).length)throw Error('Expected empty object');return {step:state.step,impressions:state.impressions,skills:state.skills.map(({id,name,kind,enabled})=>({id,name,kind,enabled})),following:state.following,chats:Object.keys(state.chats)}}},{name:'navigate_z1space_view',title:'打开 Z1Space 页面',description:'完成分身创建后打开工作区页面，不创建记录或发送消息。',inputSchema:{type:'object',properties:{view:{type:'string',enum:['discover','feed','skills','messages','profile']}},required:['view'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){if(!input||Object.keys(input).some(k=>k!=='view')||!navs.some(x=>x[0]===input.view))throw Error('Invalid view');if(state.step!=='done')throw Error('Complete onboarding first');go(input.view);return {view:currentView}}}];for(const tool of defs){try{Promise.resolve(ctx.registerTool(tool,{signal:lifecycle.signal})).catch(()=>{})}catch{}}}
render();registerAgentTools();
</script><script src="/z1space-client.js"></script></body></html>
